name: Bug 报告
description: 报告可重复的问题
title: "[Bug] "
body:
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请逐步编号。
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git Commit
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏诊断信息
      description: 不要粘贴密码、Token、Cookie、私钥或用户数据。
