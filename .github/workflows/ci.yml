name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://forecast:forecast@localhost:5432/forecast_test
      TEST_DATABASE_URL: postgresql://forecast:forecast@localhost:5432/forecast_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: forecast
          POSTGRES_DB: forecast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast -d forecast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - run: pnpm install --frozen-lockfile=false

      - name: Verify schema and committed migrations are synchronized
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/database/drizzle

      - name: Apply database migrations
        run: pnpm db:migrate

      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
