name: Generate migration preview

on:
  pull_request:
    paths:
      - 'packages/database/**'
      - '.github/workflows/generate-migration-preview.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - run: pnpm install --frozen-lockfile=false
      - run: rm -rf packages/database/drizzle
      - run: pnpm --filter @forecast/database exec drizzle-kit generate --name initial_platform

      - name: Commit generated migration when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/drizzle
          if git diff --cached --quiet; then
            echo "Migration is already current."
          else
            git commit -m "Add generated initial database migration"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: generated-drizzle-migration
          path: packages/database/drizzle
          if-no-files-found: error
          retention-days: 3
